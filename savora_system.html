<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savora | Restaurant Food Ordering & Table Management</title>
<style>
:root{--navy:#17233b;--blue:#4569d4;--bg:#f4f6fb;--ink:#263247;--muted:#788399;--line:#e4e8f0;--green:#2e9b70;--red:#d85b66;--yellow:#d59b2b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:white;font-weight:600}button.secondary{background:#edf1fb;color:var(--blue)}button.danger{background:#fff0f1;color:var(--red)}button.small{padding:7px 10px;font-size:12px}input,select,textarea{padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:white;width:100%;outline-color:var(--blue)}label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}.hidden{display:none!important}.muted{color:var(--muted)}.brand{font-size:24px;font-weight:800;letter-spacing:.5px;color:var(--navy)}.brand span{color:var(--blue)}.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:white}.auth-side{background:linear-gradient(140deg,#182641,#344d82);color:white;padding:8vw;display:flex;flex-direction:column;justify-content:center}.auth-side h1{font-size:clamp(34px,4vw,58px);margin:22px 0 12px}.auth-side p{line-height:1.7;color:#e0e7f6;max-width:480px}.auth-form-wrap{display:flex;align-items:center;justify-content:center;padding:30px}.auth-form{width:min(390px,100%)}.auth-form h2{margin-bottom:6px}.auth-form button{width:100%;margin-top:18px}.switch{margin-top:18px;text-align:center;font-size:14px}.link{color:var(--blue);cursor:pointer;font-weight:700}.app{min-height:100vh}.sidebar{width:230px;background:var(--navy);color:white;position:fixed;inset:0 auto 0 0;padding:24px 15px;display:flex;flex-direction:column;z-index:5}.sidebar .brand{color:white;padding:0 12px 28px}.nav-label{font-size:10px;letter-spacing:1.5px;color:#91a0ba;padding:10px 12px}.nav-btn{background:transparent;color:#d5dcec;text-align:left;margin:3px 0;padding:12px;border-radius:9px;font-weight:500}.nav-btn:hover,.nav-btn.active{background:#2a3b5c;color:white}.sidebar-bottom{margin-top:auto}.main{margin-left:230px;padding:26px;max-width:1700px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:24px}.topbar h1{font-size:25px;margin:0 0 6px}.topbar p{margin:0;color:var(--muted);font-size:14px}.user-pill{display:flex;align-items:center;gap:10px;background:white;border:1px solid var(--line);border-radius:30px;padding:8px 13px}.avatar{height:36px;width:36px;border-radius:50%;display:grid;place-items:center;background:#e5ebff;color:var(--blue);font-weight:bold}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 4px 15px #25385c08}.stat-label{font-size:13px;color:var(--muted)}.stat-value{font-size:27px;font-weight:800;margin:12px 0 6px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0 14px}.section-head h2,.card h2{font-size:17px;margin:0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar input{max-width:330px}.toolbar select{width:auto;min-width:150px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th,td{text-align:left;padding:13px 12px;border-bottom:1px solid var(--line)}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;background:#fafbfe}tr:last-child td{border-bottom:0}.badge{display:inline-block;border-radius:30px;padding:5px 9px;font-size:11px;font-weight:700;background:#edf0f6;color:#667085}.badge.green{background:#e5f7ef;color:#21845c}.badge.red{background:#fff0f1;color:#c74b57}.badge.yellow{background:#fff5df;color:#a87517}.badge.blue{background:#eaf0ff;color:#4263c5}.food-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.food-card{overflow:hidden;padding:0}.food-art{height:105px;display:grid;place-items:center;font-size:48px;background:linear-gradient(135deg,#f6e9dc,#f5f7ff)}.food-body{padding:13px}.food-body h3{font-size:14px;margin:0 0 7px}.food-body p{font-size:12px;color:var(--muted);margin:0 0 10px}.food-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}.price{font-weight:800;color:var(--navy)}.two-col{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr)}.table-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.table-tile{border:1px solid var(--line);border-radius:13px;padding:18px;background:white;text-align:left;color:var(--ink)}.table-tile strong{display:block;font-size:18px;margin-bottom:12px}.table-tile span{font-size:12px}.table-tile.available{border-top:4px solid var(--green)}.table-tile.occupied{border-top:4px solid var(--red)}.table-tile.reserved{border-top:4px solid var(--yellow)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.full{grid-column:1/-1}.overlay{position:fixed;inset:0;background:#101a2d80;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px}.modal{background:white;border-radius:16px;width:min(600px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 70px #101a2d35}.modal.wide{width:min(850px,100%)}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:19px}.modal-content{padding:22px}.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}.xbtn{background:#f0f2f7;color:#566176;padding:7px 10px}.cart-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.totals p{display:flex;justify-content:space-between;margin:10px 0;font-size:14px}.totals p.total{font-size:19px;font-weight:800;border-top:1px solid var(--line);padding-top:12px}.notice{padding:12px 14px;border-radius:10px;background:#eef3ff;color:#3e5db6;font-size:13px;margin:12px 0}.empty{text-align:center;padding:35px;color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tabs button{background:white;color:#5f6a7d;border:1px solid var(--line)}.tabs button.active{background:var(--blue);color:white;border-color:var(--blue)}.mobile-nav{display:none}.customer-shell{max-width:1150px;margin:auto;padding:24px}.customer-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.customer-header nav{display:flex;gap:10px}.hero{background:linear-gradient(120deg,#182641,#3e5d9b);color:white;border-radius:18px;padding:28px;margin-bottom:20px}.hero h1{margin:0 0 8px;font-size:28px}.hero p{color:#e0e7f6}.mobile-bottom{display:none}
@media(max-width:1050px){.food-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.table-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){.auth{grid-template-columns:1fr}.auth-side{display:none}.sidebar{display:none}.main{margin:0;padding:16px}.topbar h1{font-size:22px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.food-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.table-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}.mobile-bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);justify-content:space-around;padding:9px;z-index:10}.mobile-bottom button{background:white;color:var(--muted);padding:7px;font-size:11px}.mobile-bottom button.active{color:var(--blue)}.customer-shell{padding:15px;padding-bottom:75px}.customer-header nav{display:none}.user-pill .user-label{display:none}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.toolbar input{max-width:none}.toolbar>*{flex:1}.topbar .user-pill{padding:5px}.card{padding:14px}}
</style>
</head>
<body>
<div id="root"></div>
<div id="overlay-root"></div>
<script>
const categories={
 "Main Course":[["Chicken Alfredo",250,"🍝"],["Beef Burger",180,"🍔"],["Chicken Burger",170,"🍔"],["Beef Steak",350,"🥩"],["Chicken Teriyaki",220,"🍗"],["Chicken Parmesan",260,"🍗"],["Spaghetti Bolognese",200,"🍝"],["Carbonara",210,"🍝"],["Fish and Chips",230,"🐟"],["Beef Tapa",220,"🍛"],["Grilled Chicken",240,"🍗"],["Chicken Rice Bowl",200,"🍚"]],
 "Appetizers":[["French Fries",100,"🍟"],["Chicken Wings",220,"🍗"],["Mozzarella Sticks",150,"🧀"],["Onion Rings",120,"🧅"],["Nachos",180,"🌮"],["Garlic Bread",90,"🥖"],["Calamares",180,"🦑"],["Potato Wedges",130,"🥔"],["Cheese Sticks",100,"🧀"],["Spring Rolls",120,"🥟"],["Dynamite Rolls",130,"🌶️"],["Fish Balls",100,"🍢"]],
 "Drinks":[["Iced Tea",80,"🧋"],["Lemonade",90,"🍋"],["Soft Drink",70,"🥤"],["Bottled Water",50,"💧"],["Milk Tea",120,"🧋"],["Iced Coffee",130,"🧋"],["Hot Coffee",100,"☕"],["Chocolate Drink",110,"🥛"],["Mango Shake",140,"🥭"],["Strawberry Shake",140,"🍓"],["Blueberry Smoothie",150,"🫐"],["Matcha Latte",140,"🍵"]],
 "Desserts":[["Chocolate Cake",150,"🍰"],["Cheesecake",170,"🍰"],["Ice Cream",100,"🍨"],["Brownie",120,"🍫"],["Banana Split",180,"🍌"],["Waffle",150,"🧇"],["Pancakes",140,"🥞"],["Churros",130,"🥨"],["Leche Flan",120,"🍮"],["Halo-Halo",150,"🍧"],["Mango Float",140,"🥭"],["Strawberry Shortcake",160,"🍓"]]
};
const allFoods=Object.entries(categories).flatMap(([category,items])=>items.map(([name,price,emoji])=>({name,price,emoji,category,available:true})));
let state={page:"login",role:"Customer",name:"",email:"",activeNav:"Dashboard",category:"All",search:"",cart:[],orders:[],customers:[],selectedTable:1,filterStatus:"All",menu:allFoods.map(x=>({...x})),tables:Array.from({length:12},(_,i)=>({id:i+1,status:i===1?"Occupied":i===4?"Reserved":"Available",capacity:4})),selectedCustomer:null};
const money=n=>"₱"+Number(n).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function setPage(p){state.page=p;render()}
function login(role){state.role=role;state.name=state.name||"Maria Santos";state.email=state.email||"maria@example.com";state.page=role==="Customer"?"customerHome":"Dashboard";state.activeNav="Dashboard";render()}
function signUp(){const n=document.querySelector("#signupName")?.value.trim();const e=document.querySelector("#signupEmail")?.value.trim();if(!n||!e){alert("Please enter your name and email.");return}state.name=n;state.email=e;state.role="Customer";setPage("customerHome")}
function logout(){state.page="login";state.cart=[];render()}
function nav(p){state.activeNav=p;state.page=p;render()}
function addToCart(name){const item=state.menu.find(x=>x.name===name);if(!item||!item.available){alert("This item is unavailable.");return}const line=state.cart.find(x=>x.name===name);line?line.qty++:state.cart.push({...item,qty:1});render()}
function changeQty(name,delta){const item=state.cart.find(x=>x.name===name);if(item){item.qty+=delta;if(item.qty<=0)state.cart=state.cart.filter(x=>x.name!==name)}render()}
function subtotal(){return state.cart.reduce((s,x)=>s+x.price*x.qty,0)}
function placeOrder(){if(!state.cart.length){alert("Add at least one food item.");return}const order={id:1026+state.orders.length,table:state.selectedTable,customer:state.name||"Walk-in Customer",items:state.cart.map(x=>({...x})),total:subtotal(),status:"Confirmed",payment:document.querySelector("#payment")?.value||"Cash",date:new Date().toLocaleDateString()};state.orders.unshift(order);const t=state.tables.find(x=>x.id===state.selectedTable);if(t)t.status="Occupied";state.cart=[];modal("Order Confirmed",`<div style="text-align:center;padding:18px"><div style="font-size:52px">✅</div><h2>Order #${order.id} confirmed!</h2><p class="muted">Your order total is ${money(order.total)}.</p></div>`,`<button onclick="closeModal();setPage('customerOrders')">View My Orders</button>`);render()}
function statusBadge(s){const c=s==="Available"||s==="Completed"||s==="Confirmed"?"green":s==="Occupied"||s==="Cancelled"?"red":s==="Reserved"||s==="Pending"?"yellow":"blue";return `<span class="badge ${c}">${esc(s)}</span>`}
function sidebar(){const items=state.role==="Manager"?["Dashboard","Orders","Tables","Menu","Customers","Reports","Profile"]:["Dashboard","POS / Take Order","Orders","Tables","Menu","Customers","Profile"];return `<aside class="sidebar"><div class="brand">savora<span>.</span></div><div class="nav-label">WORKSPACE</div>${items.map(x=>`<button class="nav-btn ${state.activeNav===x?"active":""}" onclick="nav('${x}')">${({"Dashboard":"▦","POS / Take Order":"＋","Orders":"▤","Tables":"▦","Menu":"♨","Customers":"♙","Reports":"▥","Profile":"◉"})[x]} &nbsp; ${x}</button>`).join("")}<div class="sidebar-bottom"><button class="nav-btn" onclick="logout()">↪ &nbsp; Logout</button></div></aside>`}
function topbar(title,sub){return `<div class="topbar"><div><h1>${title}</h1><p>${sub||"Manage restaurant operations with Savora."}</p></div><div class="user-pill"><div class="avatar">${esc((state.name||"U")[0].toUpperCase())}</div><div class="user-label"><strong>${esc(state.name||state.role)}</strong><div class="muted" style="font-size:12px">${esc(state.role)}</div></div></div></div>`}
function stats(items){return `<div class="grid stats">${items.map(([a,b,c])=>`<div class="card"><div class="stat-label">${a}</div><div class="stat-value">${b}</div><div class="muted" style="font-size:12px">${c||""}</div></div>`).join("")}</div>`}
function tableHtml(headers,rows){return `<div class="card table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">No records yet.</td></tr>`}</tbody></table></div>`}
function foodCards(items,withAdd=true){return `<div class="grid food-grid">${items.map(x=>`<div class="card food-card"><div class="food-art">${x.emoji}</div><div class="food-body"><h3>${esc(x.name)}</h3><p>${esc(x.category)}</p><div class="food-bottom"><span class="price">${money(x.price)}</span>${withAdd?`<button class="small" ${!x.available?"disabled":""} onclick="addToCart('${esc(x.name)}')">+ Add</button>`:`<button class="small secondary" onclick="foodDetails('${esc(x.name)}')">View</button>`}</div><div style="margin-top:10px">${statusBadge(x.available?"Available":"Unavailable")}</div></div></div>`).join("")}</div>`}
function menuFilter(){let items=state.menu.filter(x=>(state.category==="All"||x.category===state.category)&&x.name.toLowerCase().includes(state.search.toLowerCase()));return items}
function menuToolbar(){return `<div class="toolbar"><input placeholder="🔍 Search food..." value="${esc(state.search)}" oninput="state.search=this.value;const y=window.scrollY;render();window.scrollTo(0,y)"><select onchange="state.category=this.value;render()">${["All",...Object.keys(categories)].map(x=>`<option ${state.category===x?"selected":""}>${x}</option>`).join("")}</select><select id="availFilter" onchange="render()"><option>All</option><option>Available</option><option>Unavailable</option></select></div>`}
function menuPage(){return `${topbar("Menu","Browse food items, prices, and availability.")}${menuToolbar()}${foodCards(menuFilter().filter(x=>{let f=document.querySelector("#availFilter")?.value||"All";return f==="All"||(f==="Available"&&x.available)||(f==="Unavailable"&&!x.available)}),state.role==="Customer"||state.activeNav==="POS / Take Order")}`}
function orderRows(){return state.orders.map(o=>`<tr><td>#${o.id}</td><td>Table ${String(o.table).padStart(2,"0")}</td><td>${esc(o.customer)}</td><td>${o.items.reduce((a,b)=>a+b.qty,0)}</td><td>${money(o.total)}</td><td>${statusBadge(o.status)}</td><td><button class="small secondary" onclick="orderDetails(${o.id})">View Details</button> <button class="small" onclick="changeStatus(${o.id})">Change Status</button></td></tr>`).join("")}
function ordersPage(){return `${topbar("Orders","View and update customer orders.")}${stats([["Total Orders",state.orders.length,"All recorded orders"],["Confirmed",state.orders.filter(x=>x.status==="Confirmed").length,"Awaiting preparation"],["Preparing",state.orders.filter(x=>x.status==="Preparing").length,"In progress"],["Completed",state.orders.filter(x=>x.status==="Completed").length,"Finished orders"]])}<div class="toolbar"><input placeholder="Search order or customer..." oninput="document.querySelectorAll('#ordersBody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(this.value.toLowerCase())?'':'none')"><select onchange="document.querySelectorAll('#ordersBody tr').forEach(r=>r.style.display=this.value==='All'||r.innerText.includes(this.value)?'':'none')"><option>All</option><option>Confirmed</option><option>Preparing</option><option>Completed</option><option>Cancelled</option></select></div><div class="card table-wrap"><table><thead><tr><th>Order</th><th>Table</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead><tbody id="ordersBody">${orderRows()||`<tr><td colspan="7" class="empty">No orders yet. Create one from POS / Take Order.</td></tr>`}</tbody></table></div>`}
function orderDetails(id){let o=state.orders.find(x=>x.id===id);if(!o)return;modal("Order Details",`<div class="grid two-col"><div><p class="muted">ORDER NUMBER</p><h2>#${o.id}</h2><p>Customer: <b>${esc(o.customer)}</b></p><p>Table: <b>Table ${String(o.table).padStart(2,"0")}</b></p><p>Status: ${statusBadge(o.status)}</p><p>Payment: ${esc(o.payment)}</p><p>Date: ${esc(o.date)}</p></div><div class="card"><h3>Items</h3>${o.items.map(x=>`<div class="cart-line"><span>${x.emoji} ${esc(x.name)} × ${x.qty}</span><b>${money(x.price*x.qty)}</b></div>`).join("")}<div class="totals"><p class="total"><span>Total</span><span>${money(o.total)}</span></p></div></div></div>`,`<button class="secondary" onclick="closeModal()">Close</button><button onclick="changeStatus(${o.id})">Change Status</button>`)}
function changeStatus(id){const o=state.orders.find(x=>x.id===id);if(!o)return;modal("Change Order Status",`<p>Update the status for order <b>#${o.id}</b>.</p><label>Order Status</label><select id="newStatus">${["Confirmed","Pending","Preparing","Completed","Cancelled"].map(s=>`<option ${o.status===s?"selected":""}>${s}</option>`).join("")}</select>`,`<button class="secondary" onclick="closeModal()">Cancel</button><button onclick="saveStatus(${id})">Update Status</button>`)}
function saveStatus(id){const o=state.orders.find(x=>x.id===id);if(!o)return;o.status=document.querySelector("#newStatus").value;if(o.status==="Completed"){const t=state.tables.find(x=>x.id===o.table);if(t)t.status="Available"}closeModal();render()}
function tablesPage(){let count=s=>state.tables.filter(t=>t.status===s).length;return `${topbar("Table Management","View table availability and status.")}${stats([["Total Tables",state.tables.length,"Restaurant seating"],["Available",count("Available"),"Ready for customers"],["Occupied",count("Occupied"),"Currently in use"],["Reserved",count("Reserved"),"Reserved tables"]])}<div class="toolbar"><input placeholder="Search table..." oninput="document.querySelectorAll('.table-tile').forEach(t=>t.style.display=t.innerText.toLowerCase().includes(this.value.toLowerCase())?'':'none')"><select onchange="document.querySelectorAll('.table-tile').forEach(t=>t.style.display=this.value==='All'||t.dataset.status===this.value?'':'none')"><option>All</option><option>Available</option><option>Occupied</option><option>Reserved</option></select></div><div class="grid table-grid">${state.tables.map(t=>`<button class="table-tile ${t.status.toLowerCase()}" data-status="${t.status}" onclick="tableDetails(${t.id})"><strong>Table ${String(t.id).padStart(2,"0")}</strong>${statusBadge(t.status)}<div style="margin-top:10px"><span>♙ Capacity: ${t.capacity} guests</span></div></button>`).join("")}</div>`}
function tableDetails(id){const t=state.tables.find(x=>x.id===id);modal("Table "+String(id).padStart(2,"0"),`<p>Capacity: <b>${t.capacity} guests</b></p><p>Current status: ${statusBadge(t.status)}</p><label>Change table status</label><select id="tableStatus">${["Available","Occupied","Reserved"].map(s=>`<option ${t.status===s?"selected":""}>${s}</option>`).join("")}</select>`,`<button class="secondary" onclick="closeModal()">Close</button><button onclick="state.tables.find(t=>t.id===${id}).status=document.querySelector('#tableStatus').value;closeModal();render()">Save Status</button>`)}
function customersPage(){let people=[{name:"Maria Santos",phone:"0912 XXX XXXX",email:"maria@example.com",orders:8,spent:4280,status:"Active"},{name:"Juan Dela Cruz",phone:"0917 XXX XXXX",email:"juan@example.com",orders:5,spent:2350,status:"Active"},{name:"Ana Reyes",phone:"0920 XXX XXXX",email:"ana@example.com",orders:3,spent:1280,status:"Active"},{name:"Mark Garcia",phone:"0918 XXX XXXX",email:"mark@example.com",orders:12,spent:5600,status:"Inactive"},...state.customers];return `${topbar("Customer Information","View customer details and order history.")}${stats([["Total Customers",128+state.customers.length,"Registered customers"],["New Customers",12,"This month"],["Active Today",24,"Customers with activity"]])}<div class="toolbar"><input placeholder="🔍 Search by name or contact..." oninput="document.querySelectorAll('#customersBody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(this.value.toLowerCase())?'':'none')"><button onclick="addCustomer()">＋ Add Customer</button></div><div class="card table-wrap"><table><thead><tr><th>Customer</th><th>Contact</th><th>Total Orders</th><th>Total Spent</th><th>Status</th><th>Action</th></tr></thead><tbody id="customersBody">${people.map(p=>`<tr><td><b>${esc(p.name)}</b><br><span class="muted">${esc(p.email)}</span></td><td>${esc(p.phone)}</td><td>${p.orders}</td><td>${money(p.spent)}</td><td>${statusBadge(p.status)}</td><td><button class="small secondary" onclick='customerDetails(${JSON.stringify(p).replace(/'/g,"&#39;")})'>View</button></td></tr>`).join("")}</tbody></table></div>`}
function addCustomer(){modal("Add Customer",`<label>Full Name</label><input id="cName" placeholder="Enter full name"><label>Contact Number</label><input id="cPhone" placeholder="09XX XXX XXXX"><label>Email</label><input id="cEmail" placeholder="name@email.com">`,`<button class="secondary" onclick="closeModal()">Cancel</button><button onclick="saveCustomer()">Add Customer</button>`)}
function saveCustomer(){let n=document.querySelector("#cName").value.trim(),p=document.querySelector("#cPhone").value.trim(),e=document.querySelector("#cEmail").value.trim();if(!n){alert("Please enter a customer name.");return}state.customers.push({name:n,phone:p||"Not provided",email:e||"Not provided",orders:0,spent:0,status:"Active"});closeModal();render()}
function customerDetails(p){modal("Customer Details",`<div style="display:flex;align-items:center;gap:14px"><div class="avatar" style="width:58px;height:58px;font-size:22px">${esc(p.name[0])}</div><div><h2 style="margin:0 0 6px">${esc(p.name)}</h2>${statusBadge(p.status)}</div></div><div class="grid two-col" style="margin-top:18px"><div class="card"><p class="muted">CONTACT NUMBER</p><b>${esc(p.phone)}</b><p class="muted" style="margin-top:18px">EMAIL</p><b>${esc(p.email)}</b></div><div class="card"><p class="muted">TOTAL ORDERS</p><h2>${p.orders}</h2><p class="muted">TOTAL SPENT</p><h2>${money(p.spent)}</h2></div></div><div class="section-head"><h2>Recent Order History</h2></div>${tableHtml(["Order","Date","Total","Status"],state.orders.filter(o=>o.customer===p.name).slice(0,5).map(o=>`<tr><td>#${o.id}</td><td>${esc(o.date)}</td><td>${money(o.total)}</td><td>${statusBadge(o.status)}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">No order history found.</td></tr>`)}`,`<button class="secondary" onclick="closeModal()">Close</button><button onclick="customerHistory('${esc(p.name)}')">View Order History</button>`)}
function customerHistory(name){const os=state.orders.filter(o=>o.customer===name);modal("Order History — "+name,tableHtml(["Order","Date","Items","Payment","Total","Status"],os.map(o=>`<tr><td>#${o.id}</td><td>${esc(o.date)}</td><td>${o.items.reduce((s,x)=>s+x.qty,0)}</td><td>${esc(o.payment)}</td><td>${money(o.total)}</td><td>${statusBadge(o.status)}</td></tr>`).join("")||`<tr><td colspan="6" class="empty">No orders found.</td></tr>`),`<button onclick="closeModal()">Close</button>`,"wide")}
function posPage(){return `${topbar("POS / Take Order","Select a table, add food, and calculate the bill.")}<div class="grid two-col"><div><div class="card"><div class="section-head"><h2>1. Select Table</h2></div><div class="grid table-grid">${state.tables.map(t=>`<button class="table-tile ${t.status.toLowerCase()}" style="${state.selectedTable===t.id?'outline:3px solid #4569d4':''}" onclick="state.selectedTable=${t.id};render()"><strong>Table ${String(t.id).padStart(2,"0")}</strong>${statusBadge(t.status)}</button>`).join("")}</div></div><div class="section-head"><h2>2. Select Food</h2></div>${menuToolbar()}${foodCards(menuFilter(),true)}</div><div class="card"><div class="section-head"><h2>Current Order</h2><span class="badge blue">Table ${String(state.selectedTable).padStart(2,"0")}</span></div>${state.cart.map(x=>`<div class="cart-line"><div>${x.emoji} <b>${esc(x.name)}</b><br><span class="muted">${money(x.price)} each</span></div><div><button class="small secondary" onclick="changeQty('${esc(x.name)}',-1)">−</button> ${x.qty} <button class="small" onclick="changeQty('${esc(x.name)}',1)">+</button><div style="text-align:right;margin-top:5px;font-weight:bold">${money(x.qty*x.price)}</div></div></div>`).join("")||`<div class="empty">Your order is empty. Add food from the menu.</div>`}<div class="totals"><p><span>Subtotal</span><span>${money(subtotal())}</span></p><p><span>Tax (12%)</span><span>${money(subtotal()*.12)}</span></p><p class="total"><span>Total</span><span>${money(subtotal()*1.12)}</span></p></div><label>Payment Method</label><select id="payment"><option>Cash</option><option>GCash</option><option>Card</option></select><button style="width:100%;margin-top:16px" onclick="placeOrder()">Confirm Order</button><button class="secondary" style="width:100%;margin-top:8px" onclick="state.cart=[];render()">Clear Order</button></div></div>`}
function profilePage(){return `${topbar("My Profile","View your account information.")}<div class="card" style="max-width:700px"><div style="display:flex;align-items:center;gap:16px;margin-bottom:22px"><div class="avatar" style="height:68px;width:68px;font-size:26px">${esc((state.name||"U")[0])}</div><div><h2 style="margin:0 0 7px">${esc(state.name)}</h2><span class="badge blue">${esc(state.role)}</span></div></div><div class="form-grid"><div><label>Full Name</label><input id="profileName" value="${esc(state.name)}"></div><div><label>Email</label><input id="profileEmail" value="${esc(state.email)}"></div><div><label>Role</label><input value="${esc(state.role)}" disabled></div><div><label>Account Status</label><input value="Active" disabled></div></div><button style="margin-top:18px" onclick="state.name=document.querySelector('#profileName').value;state.email=document.querySelector('#profileEmail').value;render()">Save Changes</button></div>`}
function dashboardPage(){let sales=state.orders.reduce((s,o)=>s+o.total,0);return `${topbar("Dashboard","Welcome back, ${esc(state.name)}.")}${stats([["Today's Sales",money(sales),"Based on recorded orders"],["Total Orders",state.orders.length,"Orders in this session"],["Available Tables",state.tables.filter(t=>t.status==="Available").length,"Ready for customers"],["Occupied Tables",state.tables.filter(t=>t.status==="Occupied").length,"Currently in use"]])}<div class="grid two-col"><div class="card"><div class="section-head"><h2>Recent Orders</h2><button class="small secondary" onclick="nav('Orders')">View All</button></div>${tableHtml(["Order","Customer","Total","Status"],state.orders.slice(0,5).map(o=>`<tr><td>#${o.id}</td><td>${esc(o.customer)}</td><td>${money(o.total)}</td><td>${statusBadge(o.status)}</td></tr>`).join(""))}</div><div class="card"><div class="section-head"><h2>Table Availability</h2><button class="small secondary" onclick="nav('Tables')">Manage Tables</button></div><div class="grid table-grid">${state.tables.slice(0,8).map(t=>`<button class="table-tile ${t.status.toLowerCase()}" onclick="tableDetails(${t.id})"><strong>T-${String(t.id).padStart(2,"0")}</strong>${statusBadge(t.status)}</button>`).join("")}</div></div></div>${state.role==="Manager"?`<div class="section-head"><h2>Manager Shortcuts</h2></div><div class="toolbar"><button onclick="nav('Menu')">Manage Menu</button><button onclick="nav('Tables')">Manage Tables</button><button onclick="nav('Reports')">View Reports</button></div>`:""}`}
function reportsPage(){let sales=state.orders.reduce((s,o)=>s+o.total,0);return `${topbar("Sales Reports","Overview of recorded restaurant transactions.")}${stats([["Total Sales",money(sales),"All recorded orders"],["Orders",state.orders.length,"All statuses"],["Completed Orders",state.orders.filter(o=>o.status==="Completed").length,"Finished orders"],["Average Order",money(state.orders.length?sales/state.orders.length:0),"Per order"]])}<div class="card"><h2>Recent Sales</h2>${tableHtml(["Order","Customer","Payment","Total","Status"],state.orders.map(o=>`<tr><td>#${o.id}</td><td>${esc(o.customer)}</td><td>${esc(o.payment)}</td><td>${money(o.total)}</td><td>${statusBadge(o.status)}</td></tr>`).join(""))}</div>`}
function customerHome(){return `<div class="customer-shell"><div class="customer-header"><div class="brand">savora<span>.</span></div><nav><button class="secondary" onclick="setPage('customerHome')">Home</button><button class="secondary" onclick="setPage('customerOrders')">My Orders</button><button class="secondary" onclick="setPage('customerProfile')">Profile</button><button class="secondary" onclick="logout()">Log out</button></nav><div class="user-pill"><div class="avatar">${esc((state.name||"U")[0])}</div><div class="user-label">${esc(state.name)}</div></div></div><div class="hero"><h1>Good food, good mood.</h1><p>Order your favorites with Savora.</p><button style="background:white;color:var(--navy)" onclick="document.querySelector('#customerMenu').scrollIntoView({behavior:'smooth'})">Explore Menu ↓</button></div><div class="section-head"><div><h2>Our Menu</h2><p class="muted">Fresh favorites, made for you.</p></div><button onclick="openCart()">🛒 Cart (${state.cart.reduce((s,x)=>s+x.qty,0)})</button></div><div class="tabs">${["All",...Object.keys(categories)].map(c=>`<button class="${state.category===c?'active':''}" onclick="state.category='${c}';render()">${c}</button>`).join("")}</div><div id="customerMenu">${foodCards(menuFilter(),true)}</div><div class="mobile-bottom"><button class="active" onclick="setPage('customerHome')">⌂<br>Home</button><button onclick="openCart()">🛒<br>Cart</button><button onclick="setPage('customerOrders')">▤<br>Orders</button><button onclick="setPage('customerProfile')">◉<br>Profile</button></div></div>`}
function openCart(){modal("Your Cart",`${state.cart.map(x=>`<div class="cart-line"><span>${x.emoji} ${esc(x.name)} × ${x.qty}</span><b>${money(x.price*x.qty)}</b><button class="small secondary" onclick="changeQty('${esc(x.name)}',-1)">−</button></div>`).join("")||`<div class="empty">Your cart is empty.</div>`}<div class="totals"><p><span>Subtotal</span><span>${money(subtotal())}</span></p><p class="total"><span>Total</span><span>${money(subtotal()*1.12)}</span></p></div><label>Table</label><select id="customerTable" onchange="state.selectedTable=Number(this.value)">${state.tables.map(t=>`<option value="${t.id}" ${t.id===state.selectedTable?"selected":""}>Table ${String(t.id).padStart(2,"0")} — ${t.status}</option>`).join("")}</select><label>Payment Method</label><select id="payment"><option>Cash at counter</option><option>GCash</option><option>Card</option></select>`,`<button class="secondary" onclick="closeModal()">Continue Shopping</button><button onclick="closeModal();placeOrder()">Place Order</button>`)}
function customerOrders(){return `<div class="customer-shell"><div class="customer-header"><div class="brand">savora<span>.</span></div><button class="secondary" onclick="setPage('customerHome')">← Back to Menu</button></div><h1>My Orders</h1><p class="muted">Track your recent orders and status.</p><div class="card table-wrap">${tableHtml(["Order","Date","Items","Total","Status","Action"],state.orders.filter(o=>o.customer===state.name).map(o=>`<tr><td>#${o.id}</td><td>${esc(o.date)}</td><td>${o.items.reduce((s,x)=>s+x.qty,0)}</td><td>${money(o.total)}</td><td>${statusBadge(o.status)}</td><td><button class="small secondary" onclick="orderDetails(${o.id})">Details</button></td></tr>`).join(""))}</div><div class="mobile-bottom"><button onclick="setPage('customerHome')">⌂<br>Home</button><button onclick="openCart()">🛒<br>Cart</button><button class="active" onclick="setPage('customerOrders')">▤<br>Orders</button><button onclick="setPage('customerProfile')">◉<br>Profile</button></div></div>`}
function customerProfile(){return `<div class="customer-shell"><div class="customer-header"><div class="brand">savora<span>.</span></div><button class="secondary" onclick="setPage('customerHome')">← Back to Menu</button></div><div class="card" style="max-width:650px;margin:auto"><div class="avatar" style="width:65px;height:65px;font-size:25px">${esc((state.name||"U")[0])}</div><h1>${esc(state.name)}</h1><p class="muted">${esc(state.email)}</p><label>Full Name</label><input id="customerProfileName" value="${esc(state.name)}"><label>Email</label><input id="customerProfileEmail" value="${esc(state.email)}"><button style="margin-top:16px" onclick="state.name=document.querySelector('#customerProfileName').value;state.email=document.querySelector('#customerProfileEmail').value;render()">Save Profile</button><button class="secondary" style="margin:16px 0 0 8px" onclick="logout()">Log Out</button></div><div class="mobile-bottom"><button onclick="setPage('customerHome')">⌂<br>Home</button><button onclick="openCart()">🛒<br>Cart</button><button onclick="setPage('customerOrders')">▤<br>Orders</button><button class="active" onclick="setPage('customerProfile')">◉<br>Profile</button></div></div>`}
function authPage(){return `<div class="auth"><div class="auth-side"><div class="brand" style="color:white">savora<span>.</span></div><h1>Good food.<br>Easy ordering.</h1><p>A simpler way to order food, manage restaurant tables, and keep every transaction organized.</p><p>Restaurant Food Ordering and Table Management System</p></div><div class="auth-form-wrap"><div class="auth-form"><div class="brand">savora<span>.</span></div>${state.page==="signup"?`<h2>Create your account</h2><p class="muted">Join Savora to browse and order your favorites.</p><label>Full Name</label><input id="signupName" placeholder="Enter your full name"><label>Email Address</label><input id="signupEmail" type="email" placeholder="you@example.com"><label>Password</label><input id="signupPassword" type="password" placeholder="Create a password"><button onclick="signUp()">Create Account</button><div class="switch">Already have an account? <span class="link" onclick="setPage('login')">Log in</span></div>`:`<h2>Welcome back</h2><p class="muted">Log in to continue to your Savora account.</p><label>Email Address</label><input id="loginEmail" type="email" placeholder="you@example.com" value="maria@example.com"><label>Password</label><input id="loginPassword" type="password" placeholder="Enter your password" value="password"><label>Continue as</label><select id="loginRole"><option>Customer</option><option>Cashier</option><option>Manager</option></select><button onclick="state.email=document.querySelector('#loginEmail').value;login(document.querySelector('#loginRole').value)">Log In</button><div class="switch">New to Savora? <span class="link" onclick="setPage('signup')">Create an account</span></div><div class="notice">Demo: choose Customer, Cashier, or Manager to preview each interface. No real authentication is used.</div>`}</div></div></div>`}
function render(){const root=document.querySelector("#root");if(state.page==="login"||state.page==="signup"){root.innerHTML=authPage();return}if(state.page==="customerHome"){root.innerHTML=customerHome();return}if(state.page==="customerOrders"){root.innerHTML=customerOrders();return}if(state.page==="customerProfile"){root.innerHTML=customerProfile();return}
let content=state.page==="Dashboard"?dashboardPage():state.page==="POS / Take Order"?posPage():state.page==="Orders"?ordersPage():state.page==="Tables"?tablesPage():state.page==="Menu"?menuPage():state.page==="Customers"?customersPage():state.page==="Profile"?profilePage():state.page==="Reports"?reportsPage():dashboardPage();
root.innerHTML=`<div class="app">${sidebar()}<main class="main">${content}</main><div class="mobile-bottom">${["Dashboard","POS / Take Order","Orders","Tables","Menu","Customers","Profile"].map((p,i)=>`<button class="${state.activeNav===p?'active':''}" onclick="nav('${p}')">${["▦","＋","▤","▧","♨","♙","◉"][i]}<br>${p==="POS / Take Order"?"POS":p}</button>`).join("")}</div></div>`}
function modal(title,content,footer="",size=""){document.querySelector("#overlay-root").innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal ${size}"><div class="modal-head"><h2>${title}</h2><button class="xbtn" onclick="closeModal()">✕</button></div><div class="modal-content">${content}</div>${footer?`<div class="modal-foot">${footer}</div>`:""}</div></div>`}
function closeModal(){document.querySelector("#overlay-root").innerHTML=""}
function foodDetails(name){let x=state.menu.find(f=>f.name===name);if(!x)return;modal("Food Details",`<div style="font-size:68px;text-align:center;background:#f5f6fb;padding:20px;border-radius:12px">${x.emoji}</div><h2>${esc(x.name)}</h2><p class="muted">${esc(x.category)}</p><h2>${money(x.price)}</h2><p>Freshly prepared and served by Savora.</p><p>Availability: ${statusBadge(x.available?"Available":"Unavailable")}</p>`,`<button class="secondary" onclick="closeModal()">Close</button>${state.role==="Manager"?`<button onclick="toggleFood('${esc(x.name)}')">${x.available?"Mark Unavailable":"Mark Available"}</button>`:`<button ${!x.available?"disabled":""} onclick="closeModal();addToCart('${esc(x.name)}')">Add to Cart</button>`}`)}
function toggleFood(name){let x=state.menu.find(f=>f.name===name);x.available=!x.available;closeModal();render()}
render();
</script>
</body>
</html>
